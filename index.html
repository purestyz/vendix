<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vendix · Vendas e assinaturas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="auth" hidden>
  <form id="login" class="card auth-card">
    <h1>Vendix</h1>
    <p class="muted">Pedidos, clientes e assinaturas num só lugar.</p>
    <p id="aviso" class="aviso" hidden>Configure <code>config.js</code> com a URL e a chave anon do seu projeto Supabase.</p>
    <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
    <label>Senha<input type="password" name="senha" required minlength="6" autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Entrar</button>
    <button class="btn" type="button" id="criar-conta">Criar conta</button>
  </form>
</section>

<div id="app" hidden>
  <aside class="sidebar">
    <div class="brand">Vendix</div>
    <nav id="nav">
      <a href="#/dashboard">Painel</a>
      <a href="#/pedidos">Pedidos</a>
      <a href="#/clientes">Clientes</a>
      <a href="#/produtos">Produtos</a>
      <a href="#/assinaturas">Assinaturas</a>
    </nav>
    <button id="sair" class="btn ghost">Sair</button>
  </aside>
  <main>
    <header class="topbar">
      <button id="menu" class="btn ghost" aria-label="Menu">☰</button>
      <h1 id="titulo"></h1>
    </header>
    <div id="view"></div>
  </main>
</div>

<dialog id="modal">
  <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-x" class="btn ghost" aria-label="Fechar">✕</button></div>
  <div id="modal-body"></div>
</dialog>
<div id="toasts"></div>

<script type="module" src="main.js"></script>
</body>
</html>
